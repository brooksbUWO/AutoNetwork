name=AutoNetwork
version=0.0.1
author=Brooks
maintainer=brooksbUWO
sentence=Modern WiFi connection manager with captive portal for ESP32
paragraph=Complete WiFi management solution featuring automatic credential storage, captive portal configuration, WPA2 Enterprise support, custom parameters, LED status indicator, and OTA updates. Supports both blocking and non-blocking modes with ESPAsyncWebServer. Multi-credential storage with priority-based connection and comprehensive callback system for connection status and portal state events.
category=Communication
url=https://github.com/brooksbUWO/AutoNetwork
architectures=esp32
depends=ArduinoJson (>=7.0.0), ESPAsyncWebServer, AsyncTCP, DNSServer
includes=AutoNetwork.h
