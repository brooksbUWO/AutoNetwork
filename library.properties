sentence=Modern WiFi connection manager with captive portal for ESP32
paragraph=Complete WiFi management solution featuring automatic credential storage, captive portal configuration, WPA2 Enterprise support, custom parameters, LED status indicator, and OTA updates. Operates in non-blocking mode with ESPAsyncWebServer. Multi-credential storage with priority-based connection and comprehensive callback system for connection status and portal state events.
